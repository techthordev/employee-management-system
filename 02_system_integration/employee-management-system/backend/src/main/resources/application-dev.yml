spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/employee_management
    username: springconnector
    password: springconnector

  jpa:
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        '[highlight_sql]': true

  flyway:
    enabled: true
    clean-disabled: false   # nur im dev erlaubt!
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    '[org.springframework.web]': DEBUG
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.orm.jdbc.bind]': TRACE