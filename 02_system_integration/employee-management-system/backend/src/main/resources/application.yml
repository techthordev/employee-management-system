spring:
  application:
    name: employee-management-system

  # Java 25 Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # Database Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_management
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # Migration Engine
  flyway:
    enabled: true
    schemas: public, auth
    baseline-on-migrate: true
    locations: classpath:db/migration

# Infrastructure Monitoring
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080
  error:
    include-message: always