spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/employee_management
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        '[default_schema]': public