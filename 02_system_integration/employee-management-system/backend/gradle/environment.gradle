// Logic to load and propagate environment variables from project root
ext.loadDotEnv = {
    // This finds the directory where your settings.gradle or .git lives
    def rootDir = project.rootDir
    // If your .env is even higher (e.g., in 'learning/'), we go up from root
    def envFile = file("${rootDir}/../../../.env") 

    if (envFile.exists()) {
        println ">>> SUCCESS: Loading environment from: ${envFile.absolutePath}"
        envFile.readLines().each { line ->
            if (line.trim() && !line.startsWith("#") && line.contains("=")) {
                def parts = line.split("=", 2)
                def key = parts[0].trim()
                def value = parts[1].trim().replaceAll(/^["']|["']$/, "")
                System.setProperty(key, value)
            }
        }
    } else {
        println "----------------------------------------------------------"
        println ">>> ERROR: .env file NOT FOUND"
        println ">>> Checked path: ${envFile.absolutePath}"
        println ">>> Current Gradle Root: ${rootDir.absolutePath}"
        println "----------------------------------------------------------"
    }
}

ext.getEnvProperties = {
    def excludePrefixes = ["java.", "sun.", "os.", "user.", "file.", "path."]
    return System.getProperties().findAll { entry ->
        !excludePrefixes.any { prefix -> entry.key.startsWith(prefix) }
    }
}